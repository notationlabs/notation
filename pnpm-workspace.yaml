packages:
  - "examples/*"
  - "packages/*"
  - docs
allowBuilds:
  esbuild: true
  lightningcss: true
  workerd: true
  # Pulled in by Wrangler's image bindings, which the docs site does not use.
  sharp: false
  # The docs framework ships no dist/; its prepare script builds it after clone.
  # Matching by repo URL rather than resolved commit needs pnpm 11.11+.
  "@notation/docs@git+ssh://git@github.com/djgrant/docs.git": true
minimumReleaseAgeExclude:
  - '@pokit/*'
  - '@notation/durable'
overrides:
  lodash-es@<4.18.1: ^4.18.1
  js-yaml@3: ^3.15.2
  js-yaml@>=4 <4.3.2: ^4.3.2
  browserslist@<4.28.7: ^4.28.7
  postcss-selector-parser@<6.1.5: ^6.1.5
  seroval@<1.6.11: ^1.6.11
  undici@>=7 <7.30.1: ^7.30.1
  tmp@<0.2.6: ^0.2.7
  yaml@<2.8.3: ^2.8.3
  "@babel/runtime@<7.26.10": ^7.29.7
  "@babel/helpers@<7.26.10": ^7.29.7
  "@babel/core@<7.29.6": ^7.29.7
  esbuild@>=0.27.3 <0.28.1: 0.28.1
