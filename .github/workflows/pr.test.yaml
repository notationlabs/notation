name: "Integration Tests"

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The pok CLI runs on Bun.
      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: pnpm install --frozen-lockfile --filter '!@notation/docs-site'

      - name: Build
        run: pnpm exec pok build

      - name: Install local bin scripts
        run: pnpm install --frozen-lockfile --filter '!@notation/docs-site'

      - name: Test
        run: pnpm exec pok test run
